services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hermes_control_plane
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hermes_control_plane"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "localhost:7233", "--limit", "1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    command: ["ahcp-api"]
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - type: bind
        source: ${GSC_SERVICE_ACCOUNT_HOST_FILE:-./secrets/gsc-service-account.json}
        target: /run/secrets/gsc-service-account.json
        read_only: true
        bind:
          create_host_path: false
      - wordpress_backups:/var/lib/ahcp/backups
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["ahcp-worker"]
    restart: unless-stopped

  scheduler:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      temporal:
        condition: service_healthy
      worker:
        condition: service_started
    command: ["ahcp-autonomous-scheduler"]
    restart: unless-stopped

volumes:
  postgres_data:
  wordpress_backups:

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hermes_control_plane
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hermes_control_plane"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Official Temporal CLI development server. The old temporalio/auto-setup image is deprecated.
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "localhost:7233", "--limit", "1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    env_file: .env
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: ["ahcp-api"]
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["ahcp-worker"]
    restart: unless-stopped

volumes:
  postgres_data:
